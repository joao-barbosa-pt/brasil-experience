<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Porto → Rio</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0B0D0F; overflow: hidden; }
  svg { display: block; width: 100%; height: 100%; }
  text { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: 10px; letter-spacing: .16em; fill: rgba(245,241,234,.72); }
  text.city { letter-spacing: .18em; fill: #F5F1EA; }
</style>
</head>
<body>
<svg id="map"></svg>
<script>
const PORTO = [-8.6291, 41.1579], RIO = [-43.1729, -22.9068];
const CITIES = [
  { n: "PORTO", c: PORTO, dx: -8, dy: -10, anchor: "end" },
  { n: "RIO DE JANEIRO", c: RIO, dx: 10, dy: 14, anchor: "start" }
];
let W = 0, H = 0, proj, path, arcPts = [], svg, layers = {}, progress = 0, ready = false;

const arc = d3.geoInterpolate(PORTO, RIO);
for (let i = 0; i <= 240; i++) arcPts.push(arc(i / 240));

function draw(land) {
  svg = d3.select("#map");
  const box = document.body.getBoundingClientRect();
  W = box.width; H = box.height;
  svg.attr("viewBox", `0 0 ${W} ${H}`).selectAll("*").remove();

  const cx = (PORTO[0] + RIO[0]) / 2, cy = (PORTO[1] + RIO[1]) / 2;
  const pad = Math.max(18, W * 0.05);
  const boxW = W - pad * 2, boxH = H - pad * 2;
  const needX = Math.abs(PORTO[0] - RIO[0]) * 1.12;
  const needY = Math.abs(PORTO[1] - RIO[1]) * 1.12;
  // a moldura geográfica assume a proporção da caixa: sem isto o mapa fica torto
  const ratio = boxH / boxW;
  let spanX = Math.max(needX, needY / ratio);
  const frame = { type: "LineString", coordinates: [
    [cx - spanX / 2, cy + spanX * ratio / 2], [cx + spanX / 2, cy - spanX * ratio / 2]
  ]};
  proj = d3.geoMercator().fitExtent([[pad, pad], [W - pad, H - pad]], frame);
  path = d3.geoPath(proj);

  svg.append("g").selectAll("path").data(land.features).join("path")
    .attr("d", path).attr("fill", "rgba(245,241,234,.085)")
    .attr("stroke", "rgba(245,241,234,.22)").attr("stroke-width", 0.6);

  layers.ghost = svg.append("path")
    .attr("d", path({ type: "LineString", coordinates: arcPts }))
    .attr("fill", "none").attr("stroke", "rgba(245,241,234,.2)")
    .attr("stroke-width", 1).attr("stroke-dasharray", "3 5");

  layers.live = svg.append("path").attr("fill", "none")
    .attr("stroke", "#FF5B2E").attr("stroke-width", 1.8).attr("stroke-linecap", "round");

  const g = svg.append("g");
  CITIES.forEach(c => {
    const p = proj(c.c);
    g.append("circle").attr("cx", p[0]).attr("cy", p[1]).attr("r", 3.5)
      .attr("fill", "#FF5B2E");
    const anchor = p[0] > W * 0.62 ? "end" : "start";
    g.append("text").attr("class", "city")
      .attr("x", p[0] + (anchor === "end" ? -10 : 10))
      .attr("y", Math.min(H - 10, Math.max(16, p[1] + c.dy)))
      .attr("text-anchor", anchor).text(c.n);
  });

  layers.head = svg.append("g");
  layers.head.append("circle").attr("r", 12).attr("fill", "rgba(255,91,46,.16)");
  layers.head.append("circle").attr("r", 6).attr("fill", "rgba(255,91,46,.32)");
  layers.head.append("circle").attr("r", 3).attr("fill", "#FF5B2E");
  layers.km = svg.append("text").attr("text-anchor", "middle").attr("fill", "rgba(245,241,234,.6)");
  render();
}

function render() {
  if (!layers.live) return;
  const n = Math.max(1, Math.round(progress * (arcPts.length - 1)));
  const pts = arcPts.slice(0, n + 1);
  layers.live.attr("d", path({ type: "LineString", coordinates: pts }));
  const head = proj(arcPts[n]);
  layers.head.attr("transform", `translate(${head[0]},${head[1]})`)
    .attr("opacity", progress > 0.01 && progress < 0.995 ? 1 : 0);
  const left = Math.round(7350 * (1 - progress));
  layers.km.attr("x", Math.min(W - 46, Math.max(46, head[0]))).attr("y", Math.max(18, head[1] - 16))
    .attr("opacity", progress > 0.04 && progress < 0.97 ? 1 : 0)
    .text(String(left).replace(/\B(?=(\d{3})+(?!\d))/g, "\u2009") + " KM");
}

d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json").then(topo => {
  const land = topojson.feature(topo, topo.objects.countries);
  draw(land);
  ready = true;
  try { parent.postMessage({ ready: true }, "*"); } catch (e) {}
  let t;
  window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(() => draw(land), 150); });
});

window.addEventListener("message", e => {
  if (e.data && typeof e.data.p === "number") { progress = Math.min(1, Math.max(0, e.data.p)); render(); }
});
</script>
</body>
</html>
